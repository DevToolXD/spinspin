:root{
  --paper:#ffffff;
  --ink:#0b0b0c;
  --ink-soft:#76767a;
  --ink-faint:#a8a8ac;
  --rule:#e6e4e0;
  --seal:#b4342a;
  --veil:0.74;
  --lap-w:310px;
  --lap-h:min(50vh, 400px);
  --pad:clamp(18px, 3.4vw, 40px);
  --ui:"GowunDodum", system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --brush:"WaterBrush", cursive;
  --mono:"PlexMono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  background:var(--paper);
  color:var(--ink);
  font-family:var(--ui);
  -webkit-font-smoothing:antialiased;
  overflow:hidden;
}

/* ── ground ─────────────────────────────────────────────── */
.stage{
  position:fixed; inset:0;
  display:grid;
  grid-template-rows:auto 1fr auto auto;
  isolation:isolate;
  transition:padding .42s cubic-bezier(.2,.8,.2,1);
}
/* The lap panel always makes room rather than covering the clock: a side
   column on wide screens, a bottom sheet on narrow ones. */
@media (min-width:900px){
  .stage.laps-open{padding-right:var(--lap-w)}
}
@media (max-width:899px){
  .stage.laps-open{padding-bottom:var(--lap-h)}
}
.photo{
  position:absolute; inset:0; z-index:-2;
  background-position:center; background-size:cover; background-repeat:no-repeat;
  opacity:0; transition:opacity .5s ease;
}
.stage.has-photo .photo{opacity:1}
.veil{
  position:absolute; inset:0; z-index:-1;
  background:var(--paper);
  opacity:1;
  transition:opacity .35s ease;
}
.stage.has-photo .veil{opacity:var(--veil)}

/* ── top bar ────────────────────────────────────────────── */
.topbar{
  display:flex; align-items:center; justify-content:space-between;
  gap:16px;
  padding:var(--pad) var(--pad) 0;
  transition:opacity .4s ease, transform .4s ease;
}
.wordmark{
  font-size:12px; letter-spacing:.22em;
  color:var(--ink-soft);
  white-space:nowrap;
}
.tools{display:flex; align-items:center; gap:4px}

/* ── the face ───────────────────────────────────────────── */
/* min-width:0 keeps these grid items inside their track — without it the
   nowrap clock would stretch the row and defeat fitClock's measurement. */
.topbar,.controls,.hints{min-width:0}
.face{
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:clamp(10px,1.6vw,18px);
  padding:0 var(--pad);
  min-width:0; min-height:0;
}
.clock{
  font-family:var(--brush);
  font-size:64px;           /* replaced on every layout by fitClock() */
  line-height:.95;
  letter-spacing:0;
  display:flex; align-items:baseline; justify-content:center;
  white-space:nowrap;
  cursor:pointer;
  user-select:none; -webkit-user-select:none;
  padding-top:.06em;        /* brush ascenders overshoot the em box */
}
.clock .d{
  display:inline-block; width:.60em; text-align:center; flex:none;
}
.clock .sep{width:.26em}
/* Hundredths step down a size, the way a chronograph subdial does — the
   fastest-moving digits stop competing with the ones you read. */
.clock .cs{font-size:.78em; opacity:.9}
.clock .grp{display:flex; align-items:baseline}
.clock .hidden{display:none}

.guide{
  width:var(--guide-w, 32ch);
  max-width:100%;
  height:1px;
  background:var(--rule);
  position:relative;
}
.guide::after{
  content:""; position:absolute; left:50%; top:0;
  width:0%; height:1px; background:#3a3a3d;
  transform:translateX(-50%);
  transition:width .45s cubic-bezier(.2,.8,.2,1);
}
.stage.running .guide::after{width:100%}

.state{
  display:flex; align-items:center; gap:9px;
  font-size:12px; letter-spacing:.24em; text-transform:uppercase;
  color:var(--ink-soft);
}
.dot{
  width:6px; height:6px; border-radius:50%;
  background:var(--ink-faint);
  transition:background .3s ease;
}
.stage.running .dot{background:var(--seal); animation:beat 1s steps(1,end) infinite}
.stage.paused .dot{background:var(--ink)}
@keyframes beat{50%{opacity:.25}}

/* ── controls ───────────────────────────────────────────── */
.controls{
  display:flex; align-items:stretch; justify-content:center;
  padding:0 var(--pad);
  transition:opacity .4s ease, transform .4s ease;
}
.ctl{
  appearance:none; border:0; background:none;
  font-family:inherit; font-size:14px; letter-spacing:.16em;
  color:var(--ink); cursor:pointer;
  padding:14px clamp(20px,4vw,42px);
  position:relative;
  transition:color .2s ease;
}
.ctl + .ctl::before{
  content:""; position:absolute; left:0; top:50%; transform:translateY(-50%);
  width:1px; height:16px; background:var(--rule);
}
.ctl:hover{color:var(--seal)}
.ctl[disabled]{color:var(--ink-faint); cursor:default}
.ctl[disabled]:hover{color:var(--ink-faint)}
.ctl-main{font-size:16px}

/* ── hints ──────────────────────────────────────────────── */
.hints{
  display:flex; flex-wrap:wrap; align-items:center; justify-content:center;
  gap:6px 18px;
  padding:6px var(--pad) var(--pad);
  font-size:11px; letter-spacing:.1em; color:var(--ink-faint);
  transition:opacity .4s ease;
}
.hints kbd{
  font-family:var(--mono); font-size:10px;
  border:1px solid var(--rule); border-radius:3px;
  padding:2px 5px; margin-right:5px; color:var(--ink-soft);
}

/* ── small icon/text buttons ────────────────────────────── */
.tbtn{
  appearance:none; background:none; cursor:pointer;
  border:1px solid transparent; border-radius:2px;
  font-family:inherit; font-size:11px; letter-spacing:.18em;
  color:var(--ink-soft);
  padding:7px 11px;
  display:inline-flex; align-items:center; gap:7px;
  transition:color .2s ease, border-color .2s ease;
}
.tbtn:hover{color:var(--ink); border-color:var(--rule)}
.tbtn svg{width:13px; height:13px; flex:none}
.tbtn.on{color:var(--ink); border-color:var(--rule)}

/* ── laps ───────────────────────────────────────────────── */
.laps{
  position:fixed; top:0; right:0; bottom:0;
  width:var(--lap-w);
  border-left:1px solid var(--rule);
  background:color-mix(in srgb, var(--paper) 92%, transparent);
  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);
  display:flex; flex-direction:column;
  transform:translateX(100%);
  transition:transform .42s cubic-bezier(.2,.8,.2,1);
  z-index:5;
}
.laps.open{transform:none}
.laps-head{
  display:flex; align-items:center; gap:10px;
  padding:calc(var(--pad)) 14px 12px 22px;
  border-bottom:1px solid var(--rule);
}
.laps-head h2{
  margin:0; font-size:11px; font-weight:400;
  letter-spacing:.22em; color:var(--ink-soft); white-space:nowrap;
}
.laps-head .count{font-family:var(--mono); font-size:11px; color:var(--ink-faint); margin-right:auto}
.laps-head .tbtn{padding:6px 8px}
.laps-body{overflow-y:auto; flex:1; padding:4px 0 22px}
.lap{
  display:grid; grid-template-columns:2.4em 1fr auto;
  align-items:baseline; gap:12px;
  padding:11px 22px;
  border-bottom:1px solid color-mix(in srgb, var(--rule) 55%, transparent);
  animation:lapIn .3s ease both;
}
@keyframes lapIn{from{opacity:0; transform:translateY(-6px)}}
.lap .n{font-family:var(--mono); font-size:11px; color:var(--ink-faint)}
.lap .split{font-family:var(--mono); font-size:15px; font-variant-numeric:tabular-nums}
.lap .total{font-family:var(--mono); font-size:11px; color:var(--ink-faint); font-variant-numeric:tabular-nums}
.lap.best .n, .lap.best .split{color:var(--seal)}
.lap.worst .split{color:var(--ink-soft)}
.lap .tag{
  font-family:var(--ui); font-size:9px; letter-spacing:.16em;
  margin-left:8px; vertical-align:2px;
}
.lap.best .tag{color:var(--seal)}
.lap.worst .tag{color:var(--ink-faint)}
.laps-empty{
  padding:26px 22px; font-size:12px; line-height:1.7; color:var(--ink-faint);
}

/* ── photo panel ────────────────────────────────────────── */
.photobar{
  position:fixed; left:var(--pad); transform:translateY(12px);
  bottom:calc(var(--pad) + 4px);
  display:none; align-items:center; gap:14px;
  padding:9px 16px;
  border:1px solid var(--rule); border-radius:2px;
  background:color-mix(in srgb, var(--paper) 92%, transparent);
  backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
  opacity:0; transition:opacity .3s ease, transform .3s ease;
  z-index:6;
}
.stage.has-photo .photobar{display:flex; opacity:1; transform:none}
.photobar label{
  font-size:10px; letter-spacing:.2em; color:var(--ink-soft);
}
input[type=range]{
  appearance:none; -webkit-appearance:none;
  width:118px; height:1px; background:var(--rule); outline:none;
}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none; width:11px; height:11px; border-radius:50%;
  background:var(--ink); cursor:pointer;
}
input[type=range]::-moz-range-thumb{
  width:11px; height:11px; border:0; border-radius:50%; background:var(--ink); cursor:pointer;
}

/* ── drop overlay ───────────────────────────────────────── */
.drop{
  position:fixed; inset:0; z-index:20;
  display:none; align-items:center; justify-content:center;
  background:color-mix(in srgb, var(--paper) 86%, transparent);
  backdrop-filter:blur(3px);
}
.drop.show{display:flex}
.drop-inner{
  border:1px dashed var(--ink-faint);
  padding:44px 56px;
  font-size:13px; letter-spacing:.14em; color:var(--ink-soft);
}

/* ── focus + chrome fade ────────────────────────────────── */
:focus-visible{outline:1px solid var(--seal); outline-offset:3px}
.stage.zen .topbar,
.stage.zen .controls,
.stage.zen .hints,
.stage.zen .photobar{opacity:0; pointer-events:none}
.stage.zen .topbar{transform:translateY(-8px)}
.stage.zen .controls{transform:translateY(8px)}

@media (prefers-reduced-motion:reduce){
  *{animation-duration:.001ms !important; transition-duration:.001ms !important}
}
/* Narrow: the tool buttons keep their icons and drop their labels. */
@media (max-width:760px){
  .tbtn .tlabel{display:none}
  .tbtn{padding:9px}
  .tools{gap:2px}
}
@media (max-width:899px){
  .laps{
    top:auto; left:0; right:0; bottom:0;
    width:auto; height:var(--lap-h);
    border-left:0; border-top:1px solid var(--rule);
    transform:translateY(100%);
  }
  .laps.open{transform:none}
  .laps-head{padding-top:16px}
  .stage.laps-open .photobar{opacity:0; pointer-events:none}
}
@media (max-width:640px){
  .hints{display:none}
  .controls{padding-bottom:var(--pad)}
  .photobar{left:var(--pad); right:var(--pad); justify-content:space-between}
}
</style>

        <span class="tlabel">랩 기록</span>
      </button>
      <button class="tbtn" id="photoBtn" title="배경 사진 고르기">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.2" aria-hidden="true"><rect x="1.5" y="3" width="13" height="10" rx="1"/><circle cx="5.5" cy="6.5" r="1.2"/><path d="M2 12l3.6-3.6a1 1 0 011.4 0L10 11.5M9.5 10l1.6-1.6a1 1 0 011.4 0L14.5 11"/></svg>
        <span class="tlabel" id="photoBtnText">배경 사진</span>
      </button>
      <button class="tbtn" id="fsBtn" title="전체 화면 (F)">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.2" aria-hidden="true"><path d="M6 1.5H1.5V6M10 1.5h4.5V6M6 14.5H1.5V10M10 14.5h4.5V10"/></svg>
        <span class="tlabel" id="fsBtnText">전체 화면</span>
      </button>
    </div>
  </header>

  <main class="face">
    <div class="clock" id="clock" role="timer" aria-live="off" tabindex="0" title="눌러서 시작·정지"></div>
    <div class="guide"></div>
    <div class="state"><span class="dot"></span><span id="stateText">준비</span></div>
  </main>

  <nav class="controls">
    <button class="ctl ctl-main" id="startBtn">시작</button>
    <button class="ctl" id="lapBtn" disabled>랩</button>
    <button class="ctl" id="resetBtn" disabled>초기화</button>
  </nav>

  <footer class="hints">
    <span><kbd>Space</kbd>시작·정지</span>
    <span><kbd>L</kbd>랩</span>
    <span><kbd>R</kbd>초기화</span>
    <span><kbd>F</kbd>전체 화면</span>
    <span>사진을 끌어다 놓으면 배경이 됩니다</span>
  </footer>

  <div class="photobar">
    <label for="veilRange">배경 밝기</label>
    <input type="range" id="veilRange" min="0" max="100" value="74" aria-label="배경 밝기">
    <button class="tbtn" id="clearPhoto">사진 지우기</button>
  </div>

  <aside class="laps" id="lapsPanel" aria-label="랩 기록">
    <div class="laps-head">
      <h2>랩 기록</h2>
      <span class="count" id="lapCount">0</span>
      <button class="tbtn" id="closeLaps" title="닫기" aria-label="랩 기록 닫기">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.2" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8"/></svg>
      </button>
    </div>
    <div class="laps-body" id="lapsBody">
      <p class="laps-empty">아직 기록이 없습니다.<br>시간이 흐르는 동안 <b>랩</b>을 누르면 구간이 쌓입니다.</p>
    </div>
  </aside>

  <div class="drop" id="drop"><div class="drop-inner">놓으면 배경이 됩니다</div></div>
</div>

<input type="file" id="fileInput" accept="image/*" hidden>

<script>
(function(){
  "use strict";

  var stage   = document.getElementById('stage');
  var clockEl = document.getElementById('clock');
  var stateEl = document.getElementById('stateText');
  var startBtn= document.getElementById('startBtn');
  var lapBtn  = document.getElementById('lapBtn');
  var resetBtn= document.getElementById('resetBtn');
  var lapsPanel = document.getElementById('lapsPanel');
  var lapsBody  = document.getElementById('lapsBody');
  var lapCount  = document.getElementById('lapCount');
  var photoEl = document.getElementById('photo');
  var fileInput = document.getElementById('fileInput');
  var dropEl  = document.getElementById('drop');
  var veilRange = document.getElementById('veilRange');

  /* ── timing ───────────────────────────────────────────── */
  var running = false;
  var elapsed = 0;      // ms accumulated across previous runs
  var startedAt = 0;    // performance.now() of current run
  var laps = [];        // cumulative ms at each lap
  var rafId = null;

  function now(){ return performance.now(); }
  function total(){ return running ? elapsed + (now() - startedAt) : elapsed; }

  /* ── formatting ───────────────────────────────────────── */
  // Truncate, never round: a stopwatch that shows 10.00 must have passed 10s.
  function parts(ms){
    var t = Math.max(0, Math.floor(ms));
    var cs = Math.floor(t / 10) % 100;
    var s  = Math.floor(t / 1000) % 60;
    var m  = Math.floor(t / 60000) % 60;
    var h  = Math.floor(t / 3600000);
    return {h:h, m:m, s:s, cs:cs};
  }
  function pad2(n){ return n < 10 ? '0' + n : '' + n; }
  function plain(ms){
    var p = parts(ms);
    return (p.h ? p.h + ':' : '') + pad2(p.m) + ':' + pad2(p.s) + '.' + pad2(p.cs);
  }

  /* Each glyph lives in a fixed-width slot so the brush numerals
     never shove the line around as they change. */
  function slot(ch, cls){
    var el = document.createElement('span');
    el.className = 'd' + (cls ? ' ' + cls : '');
    el.textContent = ch;
    return el;
  }
  function sep(ch){
    var el = slot(ch);
    el.classList.add('sep');
    return el;
  }

  var cells = null;   // {hourGrp, h:[], m:[], s:[], cs:[]}
  function buildClock(){
    clockEl.textContent = '';
    var hg = document.createElement('span');
    hg.className = 'grp hidden';
    var h = [slot('0'), slot('0')];
    hg.appendChild(h[0]); hg.appendChild(h[1]); hg.appendChild(sep(':'));
    clockEl.appendChild(hg);

    var m = [slot('0'), slot('0')];
    clockEl.appendChild(m[0]); clockEl.appendChild(m[1]);
    clockEl.appendChild(sep(':'));
    var s = [slot('0'), slot('0')];
    clockEl.appendChild(s[0]); clockEl.appendChild(s[1]);
    clockEl.appendChild(sep('.'));
    var cs = [slot('0','cs'), slot('0','cs')];
    clockEl.appendChild(cs[0]); clockEl.appendChild(cs[1]);

    cells = {hg:hg, h:h, m:m, s:s, cs:cs};
  }
  /* The clock is sized to the room it actually has, not to a vw guess, so
     it stays the largest thing on screen whether the lap panel is open,
     the window is a phone, or we just gained an hours group. */
  var DIGIT_EM = 0.60, SEP_EM = 0.26, CS_SCALE = 0.78;
  var faceEl = document.querySelector('.face');

  function fitClock(){
    if (!cells) return;
    var showHours = !cells.hg.classList.contains('hidden');
    var em = 4 * DIGIT_EM + 2 * SEP_EM + 2 * DIGIT_EM * CS_SCALE
           + (showHours ? 2 * DIGIT_EM + SEP_EM : 0);
    var cs = getComputedStyle(faceEl);
    var availW = faceEl.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
    var availH = faceEl.clientHeight;
    if (availW <= 0 || availH <= 0) return;
    // 0.95 leaves room for the brush tails, which overshoot their advance widths.
    var size = Math.min(availW * 0.95 / em, availH * 0.56, 240);
    size = Math.max(32, size);
    clockEl.style.fontSize = size.toFixed(1) + 'px';
    document.documentElement.style.setProperty('--guide-w', (size * em * 0.88).toFixed(0) + 'px');
  }

  function setPair(arr, n){
    var a = n < 10 ? '0' : String(Math.floor(n / 10));
    var b = String(n % 10);
    if (arr[0].textContent !== a) arr[0].textContent = a;
    if (arr[1].textContent !== b) arr[1].textContent = b;
  }
  function paint(){
    var p = parts(total());
    var wantHours = p.h > 0;
    if (wantHours !== !cells.hg.classList.contains('hidden')){
      cells.hg.classList.toggle('hidden', !wantHours);
      fitClock();
    }
    if (wantHours) setPair(cells.h, Math.min(p.h, 99));
    setPair(cells.m, p.m);
    setPair(cells.s, p.s);
    setPair(cells.cs, p.cs);
  }

  function tick(){
    paint();
    rafId = requestAnimationFrame(tick);
  }
  function loop(on){
    if (on && rafId === null) rafId = requestAnimationFrame(tick);
    if (!on && rafId !== null){ cancelAnimationFrame(rafId); rafId = null; }
  }

  /* ── state ────────────────────────────────────────────── */
  function render(){
    stage.classList.toggle('running', running);
    stage.classList.toggle('paused', !running && elapsed > 0);
    startBtn.textContent = running ? '정지' : (elapsed > 0 ? '계속' : '시작');
    stateEl.textContent  = running ? '측정 중' : (elapsed > 0 ? '멈춤' : '준비');
    lapBtn.disabled   = !running;
    resetBtn.disabled = running || (elapsed === 0 && laps.length === 0);
    clockEl.setAttribute('aria-label', '경과 시간 ' + plain(total()));
  }

  function start(){
    if (running) return;
    startedAt = now();
    running = true;
    loop(true);
    render();
  }
  function stop(){
    if (!running) return;
    elapsed = total();
    running = false;
    loop(false);
    paint();
    render();
  }
  function toggle(){ running ? stop() : start(); }

  function reset(){
    if (running) return;
    elapsed = 0; laps = [];
    paint(); renderLaps(); render();
  }

  function addLap(){
    if (!running) return;
    laps.push(total());
    renderLaps();
    if (!lapsPanel.classList.contains('open')) openLaps(true);
  }

  /* ── laps ─────────────────────────────────────────────── */
  function renderLaps(){
    lapCount.textContent = laps.length;
    if (!laps.length){
      lapsBody.innerHTML = '<p class="laps-empty">아직 기록이 없습니다.<br>시간이 흐르는 동안 <b>랩</b>을 누르면 구간이 쌓입니다.</p>';
      return;
    }
    var splits = [], prev = 0, i;
    for (i = 0; i < laps.length; i++){ splits.push(laps[i] - prev); prev = laps[i]; }

    var best = -1, worst = -1;
    if (splits.length > 1){
      var lo = Infinity, hi = -Infinity;
      for (i = 0; i < splits.length; i++){
        if (splits[i] < lo){ lo = splits[i]; best = i; }
        if (splits[i] > hi){ hi = splits[i]; worst = i; }
      }
    }

    var frag = document.createDocumentFragment();
    for (i = laps.length - 1; i >= 0; i--){
      var row = document.createElement('div');
      row.className = 'lap' + (i === best ? ' best' : '') + (i === worst ? ' worst' : '');
      var tag = i === best ? '<span class="tag">가장 빠름</span>'
              : i === worst ? '<span class="tag">가장 느림</span>' : '';
      row.innerHTML =
        '<span class="n">' + pad2(i + 1) + '</span>' +
        '<span class="split">' + plain(splits[i]) + tag + '</span>' +
        '<span class="total">' + plain(laps[i]) + '</span>';
      frag.appendChild(row);
    }
    lapsBody.textContent = '';
    lapsBody.appendChild(frag);
  }

  function openLaps(on){
    lapsPanel.classList.toggle('open', on);
    stage.classList.toggle('laps-open', on);
    document.getElementById('lapsBtn').setAttribute('aria-pressed', on ? 'true' : 'false');
    document.getElementById('lapsBtn').classList.toggle('on', on);
  }

  /* ── background photo ─────────────────────────────────── */
  function usePhoto(src){
    photoEl.style.backgroundImage = 'url("' + src + '")';
    stage.classList.add('has-photo');
    document.getElementById('photoBtnText').textContent = '사진 바꾸기';
  }
  function clearPhoto(){
    photoEl.style.backgroundImage = '';
    stage.classList.remove('has-photo');
    document.getElementById('photoBtnText').textContent = '배경 사진';
  }
  function readFile(file){
    if (!file || !/^image\//.test(file.type)) return;
    var r = new FileReader();
    r.onload = function(){ usePhoto(r.result); };
    r.readAsDataURL(file);
  }

  fileInput.addEventListener('change', function(){
    readFile(fileInput.files && fileInput.files[0]);
    fileInput.value = '';
  });
  document.getElementById('photoBtn').addEventListener('click', function(){ fileInput.click(); });
  document.getElementById('clearPhoto').addEventListener('click', clearPhoto);
  veilRange.addEventListener('input', function(){
    document.documentElement.style.setProperty('--veil', (veilRange.value / 100).toFixed(2));
  });

  var dragDepth = 0;
  window.addEventListener('dragenter', function(e){
    e.preventDefault(); dragDepth++; dropEl.classList.add('show');
  });
  window.addEventListener('dragover', function(e){ e.preventDefault(); });
  window.addEventListener('dragleave', function(e){
    e.preventDefault(); if (--dragDepth <= 0){ dragDepth = 0; dropEl.classList.remove('show'); }
  });
  window.addEventListener('drop', function(e){
    e.preventDefault(); dragDepth = 0; dropEl.classList.remove('show');
    if (e.dataTransfer && e.dataTransfer.files) readFile(e.dataTransfer.files[0]);
  });
  window.addEventListener('paste', function(e){
    var items = e.clipboardData && e.clipboardData.items;
    if (!items) return;
    for (var i = 0; i < items.length; i++){
      if (items[i].type && items[i].type.indexOf('image') === 0){
        readFile(items[i].getAsFile());
        break;
      }
    }
  });

  /* ── fullscreen ───────────────────────────────────────── */
  function fsEl(){ return document.fullscreenElement || document.webkitFullscreenElement; }
  function toggleFullscreen(){
    var root = document.documentElement;
    if (fsEl()){
      (document.exitFullscreen || document.webkitExitFullscreen).call(document);
    } else {
      var req = root.requestFullscreen || root.webkitRequestFullscreen;
      if (req) { var p = req.call(root); if (p && p.catch) p.catch(function(){}); }
    }
  }
  function onFsChange(){
    var on = !!fsEl();
    document.getElementById('fsBtnText').textContent = on ? '창 모드' : '전체 화면';
    document.getElementById('fsBtn').classList.toggle('on', on);
    if (!on) stage.classList.remove('zen');
    idle();
  }
  document.addEventListener('fullscreenchange', onFsChange);
  document.addEventListener('webkitfullscreenchange', onFsChange);
  document.getElementById('fsBtn').addEventListener('click', toggleFullscreen);

  /* Chrome recedes while the clock runs untouched in fullscreen. */
  var idleTimer = null;
  function idle(){
    stage.classList.remove('zen');
    clearTimeout(idleTimer);
    if (fsEl() && running){
      idleTimer = setTimeout(function(){ stage.classList.add('zen'); }, 2600);
    }
  }
  ['mousemove','pointerdown','keydown','wheel','touchstart'].forEach(function(ev){
    window.addEventListener(ev, idle, {passive:true});
  });

  /* ── wiring ───────────────────────────────────────────── */
  startBtn.addEventListener('click', function(){ toggle(); idle(); });
  lapBtn.addEventListener('click', addLap);
  resetBtn.addEventListener('click', reset);
  clockEl.addEventListener('click', function(){ toggle(); idle(); });
  document.getElementById('lapsBtn').addEventListener('click', function(){
    openLaps(!lapsPanel.classList.contains('open'));
  });
  document.getElementById('closeLaps').addEventListener('click', function(){ openLaps(false); });

  window.addEventListener('keydown', function(e){
    if (e.target && /^(INPUT|TEXTAREA)$/.test(e.target.tagName)) return;
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    var k = e.key.toLowerCase();
    if (e.code === 'Space' || k === ' '){ e.preventDefault(); toggle(); }
    else if (k === 'l'){ e.preventDefault(); addLap(); }
    else if (k === 'r'){ e.preventDefault(); reset(); }
    else if (k === 'f'){ e.preventDefault(); toggleFullscreen(); }
    else if (k === 'escape' && lapsPanel.classList.contains('open')) openLaps(false);
  });

  /* Keep counting honestly across tab sleep — total() is derived
     from the clock, not accumulated per frame, so nothing to fix;
     just repaint immediately when we come back. */
  document.addEventListener('visibilitychange', function(){
    if (!document.hidden) paint();
  });

  if (window.ResizeObserver){
    new ResizeObserver(fitClock).observe(faceEl);
  } else {
    window.addEventListener('resize', fitClock);
  }

  buildClock();
  fitClock();
  paint();
  render();
  renderLaps();
  // The brush face arrives with font-display:block; re-fit once it lands.
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitClock);
})();
</script>

</body>
</html>
